name: Co-creation build check
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/tla-co-creation-public-20260926]
permissions:
  contents: read
concurrency:
  group: co-creation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Public matching tests
        run: node --test tests/co-creation.test.mjs
      - name: Production build without secrets
        run: pnpm build
