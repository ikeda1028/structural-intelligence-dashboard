name: Municipality baseline collection
on:
  workflow_dispatch:
  push:
    branches: [feat/municipality-preresearch-20260926]
    paths: [.github/workflows/municipality-baseline.yml]
permissions:
  contents: read
concurrency:
  group: municipality-baseline-2026
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download ten fixed official e-Stat workbooks (no AI calls)
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('municipality-baseline-2026');root.mkdir()
          ids={'A':'000040463584','B':'000040463585','C':'000040463586','D':'000040463587','E':'000040463588','F':'000040463589','G':'000040463590','H':'000040463591','I':'000040463592','J':'000040463593'}
          manifest={'title':'総務省統計局 統計でみる市区町村のすがた2026','publication_date':'2026-06-19','area_reference_date':'2025-03-31','catalog_url':'https://www.e-stat.go.jp/stat-search/files?layout=datalist&lid=000001484933&page=1','usage_url':'https://www.stat.go.jp/data/s-sugata/riyou3.html','retrieved_at':datetime.now(timezone.utc).isoformat(),'files':[],'note':'Edition year is not observation year. Preserve every column year, unit, missing and suppressed values. No municipal budget/minute investigation has been completed by downloading these files.'}
          class OfficialRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):
              host=urllib.parse.urlparse(newurl).hostname or ''
              if not (host=='www.e-stat.go.jp' or host.endswith('.e-stat.go.jp') or host=='www.stat.go.jp'):raise ValueError('Unexpected download host')
              return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(OfficialRedirect())
          for category,sid in ids.items():
            url='https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId='+sid
            req=urllib.request.Request(url,headers={'User-Agent':'TLA-Municipal-Baseline/0.1 (public official statistics; bounded download)'})
            with opener.open(req,timeout=45) as response:
              data=response.read(12000001)
              if len(data)>12000000:raise ValueError('File too large')
              if data.startswith(b'PK'):ext='xlsx'
              elif data.startswith(bytes.fromhex('D0CF11E0')):ext='xls'
              else:raise ValueError('Expected an Excel file, not HTML')
              name='ssds2026-'+category+'.'+ext
              (root/name).write_bytes(data)
              item={'category':category,'file':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'content_disposition':response.headers.get('Content-Disposition','')}
              manifest['files'].append(item)
              print(category,len(data),ext)
            time.sleep(1.5)
          (root/'source-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('COLLECTION_SUCCESS',len(manifest['files']))
          PY
      - name: Save official source artifact
        uses: actions/upload-artifact@v4
        with:
          name: municipality-baseline-2026
          path: municipality-baseline-2026/
          retention-days: 30
          if-no-files-found: error
