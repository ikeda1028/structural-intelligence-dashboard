<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主要100自治体 調査対象</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:980px;margin:0 auto;padding:24px;color:#172033;line-height:1.7}h1{font-size:1.7rem}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d8dee9;padding:8px}th{background:#eef4ff}td.num{text-align:right;white-space:nowrap}.note{background:#fff8e6;border:1px solid #f0d38a;padding:12px;border-radius:8px}.small{color:#536174;font-size:.92rem}</style><body><h1>主要100自治体・調査対象</h1><p>人口規模の大きい自治体から、予算・議会・条例・DX・調達・インフラを同じ基準で調査するための対象リストです。</p><div class="note">選定基準：総務省統計局「統計でみる市区町村のすがた2026」の住民基本台帳人口（2024年）を優先し、欠測時は国勢調査人口（2020年）を使用。人口上位100自治体を選定しています。人口順位は重要度や評価順位ではありません。</div><p class="small">各自治体について、予算、議会、条例、DX、調達、インフラの6区分を「未着手・一部確認・主要資料確認」で管理します。公開データ：<a href="/co-creation-assets/major-municipalities-100.json">機械可読JSON</a></p><table><thead><tr><th>順位</th><th>自治体</th><th>コード</th><th>人口</th><th>調査状況</th></tr></thead><tbody>
<script>fetch('/co-creation-assets/major-municipalities-100.json').then(r=>r.json()).then(d=>{document.querySelector('tbody').innerHTML=d.municipalities.map(m=>`<tr><td>${m.rank}</td><td>${m.name}</td><td>${m.code}</td><td class="num">${m.population.toLocaleString('ja-JP')}人</td><td>未着手（予算・議会・条例・DX・調達・インフラ）</td></tr>`).join('')})</script>
</tbody></table></body></html>
