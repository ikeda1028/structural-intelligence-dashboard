<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主要100自治体 調査データ</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:1100px;margin:0 auto;padding:24px;color:#172033;line-height:1.7}h1{font-size:1.7rem}h2{margin-top:2rem;border-left:5px solid #2563eb;padding-left:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{border:1px solid #d8dee9;border-radius:10px;padding:14px;background:#fff}.tag{display:inline-block;background:#eef4ff;color:#1456b8;border-radius:999px;padding:2px 9px;font-size:.85rem}.fact{border-top:1px solid #e5eaf1;padding:9px 0}.fact:first-child{border-top:0}.small{color:#536174;font-size:.92rem}.note{background:#fff8e6;border:1px solid #f0d38a;padding:12px;border-radius:8px}.verified{color:#176b3a}.partial{color:#9a5b00}a{color:#1456b8}</style><body><h1>主要100自治体・調査データ</h1><p>予算・議会・条例・DX・調達・インフラを、公式資料で確認した結果です。</p><div class="note">調査状況は順次更新します。「確認済み」は原資料で確認した事実、「一部確認」は調査継続中の項目です。DX段階は評価・優劣ではなく、確認できた導入状況の暫定整理です。</div><main id="app"><p>読み込み中…</p></main><p class="small"><a href="/co-creation-assets/major-municipalities-100.html">対象100自治体一覧</a> ／ <a href="/co-creation-assets/major100-research.json">機械可読JSON</a></p><script>fetch('/co-creation-assets/major100-research.json').then(r=>r.json()).then(d=>{const root=document.getElementById('app');root.innerHTML=Object.values(d.municipalities).map(m=>`<section class="card"><h2>${m.name}</h2><p><span class="tag">調査状況：${m.research_status==='partial'?'一部確認':'未着手'}</span> <span class="tag">DX段階：${m.dx_stage?.overall??'—'}</span></p><p>${m.dx_stage?.basis||''}</p><h3>確認済み・確認中のファクト</h3><div>${m.facts.map(f=>`<div class="fact"><strong>${f.label}</strong><br>${f.value}<br><span class="small ${f.status==='verified'?'verified':'partial'}">${f.status==='verified'?'確認済み':'一部確認'} · <a href="${f.source_url}" target="_blank" rel="noreferrer">出典</a></span></div>`).join('')}</div><h3>次の調査</h3><ul>${m.next_tasks.map(t=>`<li>${t}</li>`).join('')}</ul></section>`).join('')}).catch(e=>document.getElementById('app').textContent='調査データを読み込めませんでした。')}</script></body></html>
